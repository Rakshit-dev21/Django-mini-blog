{% extends 'posts/base.html' %}

{% block title %}Delete Post | My Blog{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card content-card border-danger border-top border-4">
                <div class="card-body p-4 text-center">
                    <i class="bi bi-exclamation-triangle text-danger display-4"></i>
                    <h1 class="h4 mt-3">Delete this post?</h1>
                    <p class="text-muted">
                        You are about to delete "<strong>{{ post.title }}</strong>".
                        This cannot be undone.
                    </p>

                    <form method="post" class="d-flex justify-content-center gap-2">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-trash"></i> Yes, delete
                        </button>
                        <a href="{% url 'post_detail' post.id %}" class="btn btn-outline-secondary">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
